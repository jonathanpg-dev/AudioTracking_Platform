# Test-scope config — takes full precedence over src/main/resources/application.properties
# when running the test suite (Maven puts test-classes ahead of classes on the classpath).
# Points at a dedicated database so tests never touch real dev data.
spring.application.name=Platform

# Same local Postgres instance as dev, different database (audiotracking_platform_test), so this
# reuses the same gitignored application-local.properties for the username/password rather than
# hardcoding the local Postgres superuser's password a second time in a tracked file. In CI, the
# workflow sets DATABASE_USERNAME/DATABASE_PASSWORD directly as env vars for a throwaway Postgres
# service container instead -- see .github/workflows/ci.yml.
spring.config.import=optional:application-local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/audiotracking_platform_test
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

# Phase 8: Flyway now owns the test schema too (see src/main/resources/db/migration), so the
# suite actually exercises the same migrations production runs, instead of a Hibernate-generated
# schema that could silently drift from what Flyway would really produce. baseline-on-migrate
# adopts Flyway on this database's existing (pre-Flyway) schema without re-running V1's DDL; see
# the longer comment in src/main/resources/application.properties.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=test-only-secret-4f8c6a1e9b3d7f2a5c8e0b4d6f9a2c5e8b1d4f7a0c3e6b9d2f5a8c1e4b7d0f3a
jwt.expiration-ms=3600000

# Not exercised by any test (MockMvc requests don't carry an Origin header), but SecurityConfig's
# CORS bean needs a value to resolve at startup.
cors.allowed-origins=http://localhost:5173

# Not a real Google Client ID — fine for tests that don't exercise real Google verification;
# Google-login tests mock GoogleIdTokenVerifier directly instead of hitting the real network call.
google.oauth.client-id=test-client-id

# Not real R2 credentials. The S3Client/S3Presigner beans need something syntactically valid to
# construct (no network call happens at construction time), but no test ever lets a real request
# reach R2 — storage tests mock StorageService itself instead, same pattern as GoogleIdTokenVerifier.
r2.endpoint=https://test.r2.example.com
r2.access-key-id=test-access-key
r2.secret-access-key=test-secret-key
r2.bucket=test-bucket
r2.region=auto


storage.max-file-size-mb=4096
storage.presigned-url-expiration-minutes=15

spring.servlet.multipart.max-file-size=${storage.max-file-size-mb}MB
spring.servlet.multipart.max-request-size=${storage.max-file-size-mb}MB

# Mirrors the connector-level caps in src/main/resources/application.properties — see the comment
# there. AssetFileUploadSizeLimitIntegrationTest overrides storage.max-file-size-mb (and, through
# this same placeholder, these two) down to 1MB via @TestPropertySource for its own test.
server.tomcat.max-http-form-post-size=${storage.max-file-size-mb}MB
server.tomcat.max-swallow-size=${storage.max-file-size-mb}MB
