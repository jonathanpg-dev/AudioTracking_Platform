spring.application.name=Platform

# Render (and most PaaS platforms) inject PORT at runtime and route traffic to whatever it's set
# to; the :8080 fallback is what every local run (mvnw, Docker without PORT set, tests) actually
# uses. Never hardcode a port a deployment platform doesn't control.
server.port=${PORT:8080}

# Phase 8: application-local.properties is gitignored (see .gitignore) and holds this machine's
# actual local dev values (DB password, JWT secret) -- "optional:" so a fresh clone / CI / any
# real deployment that sets the DATABASE_*/JWT_* env vars directly works fine without it. See
# application-local.properties.example for the shape and docs/deployment.md for why nothing
# secret gets a hardcoded default here, unlike cors.allowed-origins/google.oauth.client-id below.
spring.config.import=optional:application-local.properties

# DATABASE_URL must be a full JDBC URL (jdbc:postgresql://host:port/db?sslmode=require), not the
# postgres:// URI most managed providers show by default in their dashboard -- see
# docs/deployment.md for converting one to the other.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Flyway (src/main/resources/db/migration) owns the schema in every environment now -- Hibernate
# only ever validates its own entity mappings against what Flyway already created, never mutates
# the schema itself. See docs/deployment.md for the migration workflow.
spring.jpa.hibernate.ddl-auto=validate

# baseline-on-migrate only ever matters for a database that already has a schema but no
# flyway_schema_history table yet -- exactly the dev/test databases from before Flyway existed
# (V1__baseline.sql is a faithful capture of the schema they already have). It's a no-op against
# any genuinely empty database (a fresh CI run, a fresh production database): Flyway just runs V1
# for real there, same as any other migration.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Comma-separated list of origins the frontend is allowed to call this API from — never "*".
# The Vite dev server's default origin is the only one enabled out of the box; a deployed
# frontend's real origin must be set here (or via the CORS_ALLOWED_ORIGINS env var) in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Google OAuth2 Client ID (Web application) from Google Cloud Console > APIs & Services > Credentials.
# This is the audience the ID token must be issued for; it is not a secret, hence the real value
# stays as a default here rather than requiring an env var like the genuinely secret values above.
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:39740111233-gpf5q3p7tj49urceq9tkcjpp0h56c182.apps.googleusercontent.com}

# Only the aggregate UP/DOWN status is exposed (Spring Boot's show-details default is "never"),
# never the component-level detail (DB URL, disk paths, etc.) that a fuller Actuator setup would
# leak -- see SecurityConfig for why this can stay unauthenticated (no secret to protect) while
# every other endpoint still requires a JWT.
management.endpoints.web.exposure.include=health

# Cloudflare R2 (S3-compatible object storage) for audio files. Every value here is read from an
# environment variable with NO default — if one isn't set, startup fails loudly with a clear
# "could not resolve placeholder" error instead of silently misconfiguring storage.
# See docs/storage.md for how to set these locally.
r2.endpoint=${R2_ENDPOINT}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket=${R2_BUCKET}
r2.region=${R2_REGION:auto}

# Single source of truth for the upload size limit — referenced below by Spring's own multipart
# properties instead of repeating the number in multiple places. 4096MB (4GB) accommodates full
# music compositions/stems, not just short beats/samples.
storage.max-file-size-mb=${STORAGE_MAX_FILE_SIZE_MB:4096}
storage.presigned-url-expiration-minutes=${STORAGE_PRESIGNED_URL_EXPIRATION_MINUTES:15}

spring.servlet.multipart.max-file-size=${storage.max-file-size-mb}MB
spring.servlet.multipart.max-request-size=${storage.max-file-size-mb}MB

# Spring's multipart limit above is enforced by Spring itself, but embedded Tomcat has its own,
# independent connector-level cap on POST body size that defaults to 2MB (server.tomcat.max-*
# below) — well under even the old 50MB limit, let alone 4GB. Without raising these too, uploads
# past 2MB would be rejected by Tomcat before Spring's multipart limit is ever consulted, making
# storage.max-file-size-mb effectively meaningless above that point.
server.tomcat.max-http-form-post-size=${storage.max-file-size-mb}MB
server.tomcat.max-swallow-size=${storage.max-file-size-mb}MB
