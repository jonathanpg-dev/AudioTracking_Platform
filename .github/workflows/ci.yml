name: CI

# Every pull request, and every push to master (the default branch this repo actually uses --
# not "main"), so a broken push is caught the same way a broken PR would be, before deploy.yml
# (workflow_run, gated on this workflow succeeding) ever gets a chance to ship it.
on:
  pull_request:
  push:
    branches: [master]

# Least-privilege default: nothing here needs to write to the repo, comment on PRs, or touch
# packages. A fork's pull_request run also never receives repository secrets regardless of this
# setting (GitHub's own protection), but declaring it explicitly documents the intent rather than
# relying on that alone.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # A real Postgres, not H2/mocked -- the whole point of the integration test suite
    # (BaseIntegrationTest) is exercising real JPA/Flyway/SQL behavior.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audiotracking_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 26 (BellSoft Liberica -- same vendor as the Dockerfile and local dev)
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: "26"
          cache: maven

      - name: Run backend tests
        # No src/main/resources/application-local.properties exists in CI (it's gitignored, by
        # design -- see application-local.properties.example), so these are the only source for
        # DATABASE_*/JWT_SECRET; application.properties requires them with no fallback default.
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/audiotracking_platform_test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          JWT_SECRET: ci-test-secret-never-used-for-anything-real-0123456789abcdef
        run: ./mvnw test -B

      - name: Build backend jar
        run: ./mvnw clean package -DskipTests -B

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5

      - name: Build backend Docker image
        # Build-only, never pushed anywhere from CI -- this just proves the Dockerfile itself is
        # correct (multi-stage build, non-root user, PORT-driven startup) on every PR, since
        # Docker isn't available in local dev here to verify it any other way. The image actually
        # deployed is built fresh by Render from this same Dockerfile at deploy time.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
